# Backend CI/CD Workflow for AWS EC2 + RDS
# Place this file at .github/workflows/backend.yml

name: Backend CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Lint and Test
        run: |
          cd server
          npm run lint
          npm test

      - name: Build Docker image
        run: |
          cd server
          docker build -t boatowner-backend:latest .

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd BoatOwner/server || git clone <YOUR_REPO_URL> BoatOwner && cd BoatOwner/server
            git pull origin develop
            cp .env.example .env
            docker compose up -d --build

      - name: Run DB migrations
        run: |
          cd server
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify Success
        run: echo "Backend deployed successfully!"
