name: Deploy API to DEV (Robust)

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30  # Overall job timeout
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v2

      - name: 🔍 Debug runner environment
        run: |
          echo "=== GitHub Actions Runner Debug Info ==="
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "GitHub Workspace: $GITHUB_WORKSPACE"
          echo "Current directory: $(pwd)"
          echo "Current user: $(whoami)"
          echo "=== System Resources ==="
          echo "Available disk space:"
          df -h
          echo "Available memory:"
          free -h || echo "free command not available on macOS"
          echo "CPU info:"
          nproc || echo "nproc not available"
          echo "=== Docker Environment ==="
          docker --version
          docker info || echo "Docker info failed"
          echo "=== Node.js Environment ==="
          node --version
          npm --version
          echo "=== Environment Variables ==="
          env | grep -E '^(GITHUB|RUNNER|NODE)' | sort

      - name: 🧹 Cleanup previous builds
        run: |
          echo "=== Cleaning up previous builds ==="
          docker image rm boatowner-api:latest 2>/dev/null || echo "No existing image to remove"
          docker builder prune -f
          docker system prune -f
          echo "=== Post-cleanup disk space ==="
          df -h

      - name: 🔨 Build Docker image (Primary attempt)
        id: primary-build
        continue-on-error: true
        working-directory: ./server
        timeout-minutes: 15
        run: |
          echo "=== Docker Build Started at $(date) ==="
          echo "=== Available disk space ==="
          df -h
          echo "=== Starting Docker build with timeout ==="
          
          # Build with timeout and better logging
          timeout 900 docker build \
            --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" \
            --progress=plain \
            --no-cache \
            -t boatowner-api:latest . || {
            echo "=== Primary Docker build failed ==="
            echo "=== Docker system info ==="
            docker system df
            echo "=== Docker processes ==="
            docker ps -a
            exit 1
          }
          
          echo "=== Docker Build Completed at $(date) ==="
          echo "=== Final image size ==="
          docker images boatowner-api:latest

      - name: 🔨 Build Docker image (Fallback attempt)
        if: steps.primary-build.outcome == 'failure'
        working-directory: ./server
        timeout-minutes: 20
        run: |
          echo "=== Starting Fallback Docker Build ==="
          echo "=== Using optimized Dockerfile ==="
          
          # Try with the optimized Dockerfile
          if [ -f dockerfile.optimized ]; then
            echo "Using optimized Dockerfile..."
            timeout 1200 docker build \
              --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" \
              --progress=plain \
              -f dockerfile.optimized \
              -t boatowner-api:latest . || {
              echo "=== Optimized build also failed ==="
              echo "=== Attempting minimal build strategy ==="
              
              # Last resort: build in steps
              echo "Building base image first..."
              docker build --target builder \
                --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" \
                --progress=plain \
                -f dockerfile.optimized \
                -t boatowner-api:builder .
              
              echo "Building final image..."
              docker build \
                --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" \
                --progress=plain \
                -f dockerfile.optimized \
                -t boatowner-api:latest .
            }
          else
            echo "No optimized Dockerfile found, trying with different flags..."
            timeout 1200 docker build \
              --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" \
              --progress=plain \
              --memory=2g \
              -t boatowner-api:latest .
          fi
          
          echo "=== Fallback Build Completed ==="
          docker images boatowner-api:latest

      - name: 💾 Save Docker image to tar
        timeout-minutes: 10
        working-directory: ./server
        run: |
          echo "=== Saving Docker image at $(date) ==="
          echo "=== Available disk space before save ==="
          df -h
          
          # Save image with timeout
          timeout 600 docker save boatowner-api:latest -o boatowner-api.tar || {
            echo "=== Docker save failed or timed out ==="
            echo "=== Available disk space after failure ==="
            df -h
            exit 1
          }
          
          echo "=== Docker image saved successfully ==="
          echo "=== Image file size ==="
          ls -lh boatowner-api.tar
          echo "=== Available disk space after save ==="
          df -h

      - name: 📋 Prepare deployment files
        run: |
          # Create deployment directory with proper structure
          mkdir -p deployment-files
          cp server/boatowner-api.tar deployment-files/
          cp docker-compose.dev.yml deployment-files/
          cp server/.env.dev deployment-files/
          
          # Verify files exist
          echo "=== Files prepared for deployment ==="
          ls -la deployment-files/
          echo "=== Verifying file types ==="
          file deployment-files/*

      - name: 📤 Upload deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "deployment-files/*"
          target: "~/boatowner-deployment/"
          strip_components: 1
          overwrite: true

      - name: 🚀 Deploy and run Docker Compose on EC2 (develop)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            # Navigate to deployment directory
            cd ~/boatowner-deployment
            
            # Debug: List files to verify they exist and are files (not directories)
            echo "=== Checking deployment files ==="
            ls -la
            echo "=== Verifying file types ==="
            file boatowner-api.tar docker-compose.dev.yml .env.dev
            
            # Load Docker image
            echo "=== Loading Docker image ==="
            docker load -i boatowner-api.tar
            
            # Stop existing containers if running
            echo "=== Stopping existing containers ==="
            docker-compose -f docker-compose.dev.yml down || echo "No containers to stop"
            
            # Start services with Docker Compose using DEV environment
            echo "=== Starting Docker Compose for DEV ==="
            docker-compose -f docker-compose.dev.yml up -d
            
            # Show running containers
            echo "=== Running containers ==="
            docker ps
            
            # Show container logs for debugging
            echo "=== Container logs ==="
            docker-compose -f docker-compose.dev.yml logs --tail=20
            
            # Clean up old Docker images
            echo "=== Cleaning up old images ==="
            docker image prune -f

      - name: ✅ Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            echo "=== Final deployment verification ==="
            cd ~/boatowner-deployment
            docker-compose -f docker-compose.dev.yml ps
            
            # Test if the API is responding (adjust port if needed)
            echo "=== Testing API health endpoint ==="
            sleep 10  # Give container time to start
            
            # Multiple health check attempts
            for i in {1..5}; do
              if curl -f --max-time 10 http://localhost:3001/health; then
                echo "Health check passed on attempt $i!"
                break
              else
                echo "Health check attempt $i failed, retrying in 5 seconds..."
                sleep 5
              fi
            done

      - name: 🎉 Notify Success
        run: echo "Backend deployed to DEV EC2 successfully!"

      - name: 🚨 Debug on failure
        if: failure()
        run: |
          echo "=== Deployment Failed - Debug Information ==="
          echo "Job status: ${{ job.status }}"
          echo "Available disk space:"
          df -h
          echo "Docker images:"
          docker images
          echo "Docker containers:"
          docker ps -a
          echo "Docker system info:"
          docker system df
