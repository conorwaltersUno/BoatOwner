name: Run Migrations on EC2

description: >
  This workflow SSHes into your EC2 instance and runs database migrations securely inside your VPC, avoiding public RDS exposure.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        default: 'dev'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run DB migrations on DEV EC2
        if: ${{ github.event.inputs.environment == 'dev' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            cd ~/BoatOwner/server
            npx prisma migrate deploy

      - name: Run DB migrations on PROD EC2
        if: ${{ github.event.inputs.environment == 'prod' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            cd ~/BoatOwner/server
            npx prisma migrate deploy
