name: Deploy API to DEV

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v2

      - name: 🔍 Debug runner environment
        run: |
          echo "=== GitHub Actions Runner Debug Info ==="
          echo "Runner OS: $RUNNER_OS"
          echo "Current directory: $(pwd)"
          echo "=== System Resources ==="
          echo "Available disk space:"
          df -h
          echo "Available memory:"
          free -h || echo "free command not available on macOS"
          echo "=== Docker Environment ==="
          docker --version
          docker system df
          echo "=== Dockerfile content ==="
          cat server/dockerfile

      - name: 🧹 Cleanup previous builds
        run: |
          echo "=== Cleaning up previous builds ==="
          docker image rm boatowner-api:latest 2>/dev/null || echo "No existing image to remove"
          docker builder prune -f
          echo "=== Post-cleanup disk space ==="
          df -h

      - name: Build Docker image
        working-directory: ./server
        timeout-minutes: 15
        run: |
          echo "=== Docker Build Started at $(date) ==="
          echo "=== Available resources before build ==="
          df -h
          free -h
          echo "=== Starting Docker build (legacy builder compatible) ==="
          
          # Check if we can see npm install progress by monitoring container
          timeout 900 docker build \
            --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" \
            --no-cache \
            -t boatowner-api:latest . &
          
          BUILD_PID=$!
          
          # Monitor the build process
          echo "=== Monitoring Docker build (PID: $BUILD_PID) ==="
          
          # Check every 30 seconds for npm install progress
          while kill -0 $BUILD_PID 2>/dev/null; do
            echo "Build still running at $(date)..."
            
            # Check if there are any npm install containers running
            NPM_CONTAINERS=$(docker ps --filter "ancestor=node:22" --format "table {{.ID}}\t{{.Status}}" 2>/dev/null || echo "")
            if [ ! -z "$NPM_CONTAINERS" ]; then
              echo "=== Active npm install containers ==="
              echo "$NPM_CONTAINERS"
              
              # Try to get logs from the running container
              CONTAINER_ID=$(docker ps --filter "ancestor=node:22" -q | head -1)
              if [ ! -z "$CONTAINER_ID" ]; then
                echo "=== Latest logs from npm install ==="
                docker logs --tail=10 $CONTAINER_ID 2>/dev/null || echo "Could not get container logs"
              fi
            fi
            
            # Check system resources
            echo "=== System status ==="
            echo "Memory: $(free -h | grep Mem:)"
            echo "Disk: $(df -h / | tail -1)"
            
            sleep 30
          done
          
          # Wait for the build to complete
          wait $BUILD_PID
          BUILD_EXIT_CODE=$?
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== Docker build failed with exit code $BUILD_EXIT_CODE ==="
            echo "=== Docker system info ==="
            docker system df
            echo "=== Docker processes ==="
            docker ps -a
            echo "=== Failed containers logs ==="
            docker ps -a --filter "status=exited" --format "{{.ID}}" | head -3 | xargs -I {} docker logs {} 2>/dev/null || echo "No failed container logs"
            exit 1
          fi
          
          echo "=== Docker Build Completed Successfully at $(date) ==="
          echo "=== Final image size ==="
          docker images boatowner-api:latest

      - name: Save Docker image to tar
        working-directory: ./server
        timeout-minutes: 10
        run: |
          echo "=== Saving Docker image at $(date) ==="
          echo "=== Available disk space before save ==="
          df -h
          
          # Save image with timeout
          timeout 600 docker save boatowner-api:latest -o boatowner-api.tar || {
            echo "=== Docker save failed or timed out ==="
            echo "=== Available disk space after failure ==="
            df -h
            exit 1
          }
          
          echo "=== Docker image saved successfully ==="
          echo "=== Image file size ==="
          ls -lh boatowner-api.tar
          echo "=== Available disk space after save ==="
          df -h

      - name: Prepare deployment files
        run: |
          # Create deployment directory with proper structure
          mkdir -p deployment-files
          cp server/boatowner-api.tar deployment-files/
          cp docker-compose.dev.yml deployment-files/
          cp server/.env.dev deployment-files/
          
          # Verify files exist
          echo "=== Files prepared for deployment ==="
          ls -la deployment-files/
          echo "=== Verifying file types ==="
          file deployment-files/*

      - name: Upload deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "deployment-files/*"
          target: "~/boatowner-deployment/"
          strip_components: 1
          overwrite: true

      - name: Deploy and run Docker Compose on EC2 (develop)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            # Navigate to deployment directory
            cd ~/boatowner-deployment
            
            # Debug: List files to verify they exist and are files (not directories)
            echo "=== Checking deployment files ==="
            ls -la
            echo "=== Verifying file types ==="
            file boatowner-api.tar docker-compose.dev.yml .env.dev
            
            # Load Docker image
            echo "=== Loading Docker image ==="
            docker load -i boatowner-api.tar
            
            # Stop existing containers if running
            echo "=== Stopping existing containers ==="
            docker-compose -f docker-compose.dev.yml down || echo "No containers to stop"
            
            # Start services with Docker Compose using DEV environment
            echo "=== Starting Docker Compose for DEV ==="
            docker-compose -f docker-compose.dev.yml up -d
            
            # Show running containers
            echo "=== Running containers ==="
            docker ps
            
            # Show container logs for debugging
            echo "=== Container logs ==="
            docker-compose -f docker-compose.dev.yml logs --tail=20
            
            # Clean up old Docker images
            echo "=== Cleaning up old images ==="
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            echo "=== Final deployment verification ==="
            cd ~/boatowner-deployment
            docker-compose -f docker-compose.dev.yml ps
            
            # Test if the API is responding (adjust port if needed)
            echo "=== Testing API health endpoint ==="
            sleep 10  # Give container time to start
            curl -f http://localhost:3001/health || echo "Health check failed - container may still be starting"

      - name: Notify Success
        run: echo "Backend deployed to DEV EC2 successfully!"