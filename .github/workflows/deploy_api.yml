name: Deploy API

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"

defaults:
  run:
    working-directory: ./server

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" -t boatowner-api:latest .

      - name: Save Docker image to tar
        run: |
          cd server
          docker save boatowner-api:latest -o boatowner-api.tar

      - name: Copy Docker image to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./server/boatowner-api.tar"
          target: "~"
          overwrite: true

      - name: Copy .env.development to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./server/.env.development"
          target: "~/BoatOwner/server"
          overwrite: true

      - name: Copy docker-compose.yml to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./docker-compose.yml"
          target: "~/BoatOwner/server"
          overwrite: true
          
      - name: Deploy and run Docker Compose on EC2 (develop)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            docker load -i ~/boatowner-api.tar
            cp ~/BoatOwner/server/.env.development ~/BoatOwner/server/.env
            cd ~/BoatOwner/server
            ls -l
            ls -l docker-compose.yml
            ls -l .env
            docker-compose up -d --build || docker compose up -d --build
            docker image prune -f

      - name: Notify Success
        run: echo "Backend deployed to DEV EC2 successfully!"
