name: Deploy API

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"

defaults:
  run:
    working-directory: ./server

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" -t boatowner-api:latest .

      - name: Save Docker image to tar
        run: |
          docker save boatowner-api:latest -o boatowner-api.tar

      - name: Copy Docker image to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./server/boatowner-api.tar"
          target: "~/boatowner-api.tar"

      - name: Deploy and run Docker Compose on EC2 (develop)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            mkdir -p ~/BoatOwner/server
            docker load -i ~/boatowner-api.tar
            cp .env.example .env
            docker compose up -d --build
            docker image prune -f

      - name: Notify Success
        run: echo "Backend deployed to DEV EC2 successfully!"
