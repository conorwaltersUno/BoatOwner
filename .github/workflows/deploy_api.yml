name: Deploy API

on:
  push:
    branches:
      - develop
    paths:
      - "server/**"

defaults:
  run:
    working-directory: ./server

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build --build-arg API_DB_URL="${{ secrets.API_DB_URL }}" -t boatowner-api:latest .

      - name: Save Docker image to tar
        run: |
          docker save boatowner-api:latest -o boatowner-api.tar

      - name: Copy Docker image to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./server/boatowner-api.tar"
          target: "~/boatowner-api.tar"

      - name: Copy .env.example to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./server/.env.example"
          target: "~/BoatOwner/server/.env.example"

      - name: Copy .env.development to EC2 (develop)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./server/.env.development"
          target: "~/BoatOwner/server/.env.development"

      - name: Diagnostic EC2 SSH & Environment Info
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            echo "== Hostname and IP =="
            hostname
            ip addr
            echo "== Current User =="
            whoami
            echo "== Home Directory Permissions =="
            ls -ld ~
            echo "== Target Path Permissions =="
            ls -l ~/boatowner-api.tar || echo "No tar file yet"
            echo "== Docker Containers =="
            docker ps -a || echo "Docker not running"
            echo "== Disk Space =="
            df -h
            echo "== Network Info =="
            netstat -tuln | grep 22 || echo "No SSH port open"
            echo "== Last 20 lines of auth.log =="
            sudo tail -20 /var/log/auth.log || echo "No auth.log access"

      - name: Deploy and run Docker Compose on EC2 (develop)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            mkdir -p ~/BoatOwner/server
            docker load -i ~/boatowner-api.tar
            cp ~/BoatOwner/server/.env.development ~/BoatOwner/server/.env
            cd ~/BoatOwner/server
            docker-compose up -d --build
            docker image prune -f

      - name: Notify Success
        run: echo "Backend deployed to DEV EC2 successfully!"
