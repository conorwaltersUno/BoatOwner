version: "3.4"
services:
  db:
    image: postgres:latest
    container_name: boatownr_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
  flyway:
    image: flyway/flyway
    command: -url=jdbc:postgresql://db/postgres -schemas=public -user=user
      -password=password -connectRetries=5 migrate
    volumes:
      - ./database:/flyway/sql
    depends_on:
      - db
  api:
    profiles: ["dev"]
    build:
      context: ./server
      dockerfile: dockerfile.local
    volumes:
      - ./server:/app
    ports:
      - "3001:3001"
    depends_on:
      - flyway
    environment:
      DATABASE_URL: "postgres://user:password@db:5432/postgres?schema=public"
      ACCESS_TOKEN_SECRET: "q4yQNhc7qU"
      REFRESH_TOKEN_SECRET: "O0KwrXUFWx"

volumes:
  db:
    name: boatownr_db
