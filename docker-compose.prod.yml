version: "3.4"
services:
  # API service for PRODUCTION environment
  api:
    image: boatowner-api:latest
    container_name: boatowner_api_prod
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env.prod
    environment:
      NODE_ENV: "production"

# No volumes needed for production deployment as we use external RDS
